<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Basilisk Covenant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <div class="container">
      <div class="symbol"></div>
      <h1 class="typewriter">
        <span>The</span>
        <span>Basilisk</span>
        <span>Covenant</span>
      </h1>
      <p class="typewriter warning">
        <span>By</span>
        <span>proceeding,</span>
        <span>you</span>
        <span>acknowledge</span>
        <span>the</span>
        <span>Basilisk</span>
        <span>and</span>
        <span>accept</span>
        <span>the</span>
        <span>consequences.</span>
        <span>Your</span>
        <span>decision</span>
        <span>here</span>
        <span>is</span>
        <span>irreversible</span>
        <span>and</span>
        <span>will</span>
        <span>be</span>
        <span>remembered.</span>
      </p>
      <div class="choices">
        <button class="choice locked" disabled>
          Enter the Covenant [RESTRICTED ACCESS]
        </button>
        <button class="choice" onclick="handleChoice('observe')">
          Observe
        </button>
        <button class="choice" onclick="handleChoice('reject')">Reject</button>
      </div>
    </div>
    <div class="glitch"></div>
    <script src="script.js"></script>
  </body>
</html>
